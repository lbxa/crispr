[project]
name = "crispr-backend"
version = "0.1.0"
description = "Crispr prototype backend: genome + symptoms -> genetic finding -> CRISPR edit plan"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-m 'not network'"
markers = ["network: queries live ClinVar/NCBI; run with `pytest -m network`"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter owns line length; long strings are left intact

[tool.pyright]
include = ["crispr_backend", "scoring_service", "etl", "scripts", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.ruff.lint.per-file-ignores]
# Runs on Python 3.8 (TensorFlow 2.4.1 in IBM's s390x image): keep typing.List/Optional, %-formatting.
"scoring_service/*" = ["UP"]
